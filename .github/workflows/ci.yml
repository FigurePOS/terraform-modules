name: Integration
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@figurepos"

      - name: Install platform-tooling
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm install --global @figurepos/platform-tooling@2.8.0

      - name: Copy lint config
        run: |
          mkdir -p .ci
          fgr tf config tflint > .ci/.tflint.hcl
          # python-hcl2 treats `for` as a keyword, so these Grafana alert files fail to parse.
          fgr tf config checkov \
            --skip-path grafana-alert-event-latency/grafana.tf \
            --skip-path grafana-alert-http-endpoint/grafana.tf \
            --skip-path grafana-alert-http-client/grafana.tf \
            --skip-path grafana-alert-ratio/grafana.tf \
            --skip-path aws-sqs-queue/grafana.tf \
            > .ci/.checkov.yaml

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ~1.13.0

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: tflint --config "$GITHUB_WORKSPACE/.ci/.tflint.hcl" --recursive

      - name: scan for misconfigurations with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          framework: terraform
          output_format: cli
          config_file: .ci/.checkov.yaml

      - name: validate aws-dynamodb-table
        uses: ./.github/actions/validate-module
        with:
          directory: aws-dynamodb-table

      - name: validate aws-ecs-autoscaling
        uses: ./.github/actions/validate-module
        with:
          directory: aws-ecs-autoscaling

      - name: validate aws-ecs-service
        uses: ./.github/actions/validate-module
        with:
          directory: aws-ecs-service

      - name: validate aws-ecs-task-definition
        uses: ./.github/actions/validate-module
        with:
          directory: aws-ecs-task-definition

      - name: validate aws-lambda-function
        uses: ./.github/actions/validate-module
        with:
          directory: aws-lambda-function

      - name: validate aws-s3-bucket
        uses: ./.github/actions/validate-module
        with:
          directory: aws-s3-bucket

      - name: validate aws-sqs-queue
        uses: ./.github/actions/validate-module
        with:
          directory: aws-sqs-queue

      - name: validate axiom-monitor-event-latency
        uses: ./.github/actions/validate-module
        with:
          directory: axiom-monitor-event-latency

      - name: validate axiom-monitor-http-client
        uses: ./.github/actions/validate-module
        with:
          directory: axiom-monitor-http-client

      - name: validate axiom-monitor-http-endpoint
        uses: ./.github/actions/validate-module
        with:
          directory: axiom-monitor-http-endpoint

      - name: validate axiom-monitor-ratio
        uses: ./.github/actions/validate-module
        with:
          directory: axiom-monitor-ratio

      - name: validate axiom-monitor-redis
        uses: ./.github/actions/validate-module
        with:
          directory: axiom-monitor-redis

      - name: validate datadog-dashboard-service
        uses: ./.github/actions/validate-module
        with:
          directory: datadog-dashboard-service

      - name: validate datadog-monitor-event-latency
        uses: ./.github/actions/validate-module
        with:
          directory: datadog-monitor-event-latency

      - name: validate datadog-monitor-http-endpoint
        uses: ./.github/actions/validate-module
        with:
          directory: datadog-monitor-http-endpoint

      - name: validate datadog-monitor-metric
        uses: ./.github/actions/validate-module
        with:
          directory: datadog-monitor-metric

      - name: validate datadog-monitor-metric-slo
        uses: ./.github/actions/validate-module
        with:
          directory: datadog-monitor-metric-slo

      - name: validate grafana-alert-event-latency
        uses: ./.github/actions/validate-module
        with:
          directory: grafana-alert-event-latency

      - name: validate grafana-alert-http-client
        uses: ./.github/actions/validate-module
        with:
          directory: grafana-alert-http-client

      - name: validate grafana-alert-http-endpoint
        uses: ./.github/actions/validate-module
        with:
          directory: grafana-alert-http-endpoint

      - name: validate grafana-alert-ratio
        uses: ./.github/actions/validate-module
        with:
          directory: grafana-alert-ratio

      - name: validate grafana-dashboard-service
        uses: ./.github/actions/validate-module
        with:
          directory: grafana-dashboard-service
